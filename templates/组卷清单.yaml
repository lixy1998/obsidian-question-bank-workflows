# ===== 组卷清单（export_student_paper.py --清单 的输入）=====
# 只写题目 id 就能出卷；分值/来源/角度/选项序/括号/小问分值 按需加，不加则自动取题库值。
卷名: 9年级上历史第1-4单元月考          # 必填：用于输出命名与图片命名空间
标题: 2026—2027学年第一学期　9年级历史上册　第1—4单元阶段测试
副标题: 姓名：__________　班级：__________　得分：__________
说明:
  - 满分：100分　　建议用时：45分钟
  - 每小题只有一个选项符合题意，请将所选答案填入卷末答题卡内。
题目:
  # ① 最简写法：只写 id，顺序即卷面顺序
  - 2024河南中考-13
  # ② 带组卷元数据（覆盖题库值）
  - id: 2026湖北中考-27
    分值: 2                              # 非选择题会渲染成「3．（6分）」
    来源: (2026·湖北中考·27)              # 学生卷加 --标来源 才附；题目来源一律记入《命题说明》
    角度: 第1课·文明起源——知识卡片式材料判断农业文明起源的多源性
  # ③ 重排选项使答案分布均衡（题库原题不动，答案自动换算）
  #    先跑 `--均衡选项` 拿方案，再把「选项序」写到这里
  - id: 2024河南中考-15
    选项序: [3, 1, 2, 4]                 # 新 A/B/C/D 位依次放原第 3、1、2、4 项
  # ④ 作答括号位置（默认自动判断；自动补在非末行时体检会提示核对）
  - id: 2025河南中考-12
    括号: 首行                            # 首行 | 末行 | 无
  # ⑤ 非选择题小问分值（《命题说明》细目表用；不写则按卷面分值均分）
  - id: 洛阳市2025-2026学年9上期末-21
    分值: 12
    小问分值: [6, 4, 2]
# ---------------------------------------------------------------------------
# 用法：
#   python export_student_paper.py --清单 组卷清单.yaml --体检
#   python export_student_paper.py --清单 组卷清单.yaml --均衡选项
#   python export_student_paper.py --清单 组卷清单.yaml --模式 学生 --docx 卷_学生版.docx
#   python export_student_paper.py --清单 组卷清单.yaml --模式 命题说明 --docx 卷_命题说明.docx
# 也接受 .json（同结构）与 .txt（一行一个 id）；兼容旧 selected.json（顶层数组）。
